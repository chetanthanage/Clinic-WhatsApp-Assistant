<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · Clinic WhatsApp Assistant</title>
<meta name="description" content="Sign in to the Clinic WhatsApp Assistant dashboard.">
<link rel="icon" href="assets/logo.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ ANIMATED BACKGROUND (same as the dashboard) ============ -->
<div class="bg-scene" aria-hidden="true">
  <div class="bg-scene__wash"></div>
  <div class="blob blob--purple"></div>
  <div class="blob blob--blue"></div>
  <div class="blob blob--pink"></div>
  <div class="blob blob--cyan"></div>
  <div class="blob blob--orange"></div>
</div>

<div class="login-scene">
  <div class="login-card glass">
    <img class="login-card__logo" src="assets/logo.png" alt="Clinic logo">
    <h1 class="login-card__app-name">Clinic WhatsApp Assistant</h1>
    <p class="login-card__clinic">Dr. Rohini K. Patole Clinic</p>

    <form class="login-form" id="loginForm" novalidate>
      <div class="login-banner login-banner--error" id="loginError" role="alert"></div>

      <div class="field">
        <label class="login-field__label" for="loginEmail">Email</label>
        <div class="login-field__input-wrap">
          <input class="login-field__input" type="email" id="loginEmail" autocomplete="username" placeholder="you@clinic.com" required>
        </div>
        <span class="login-field__error" id="loginEmailError">Enter a valid email address.</span>
      </div>

      <div class="field">
        <label class="login-field__label" for="loginPassword">Password</label>
        <div class="login-field__input-wrap">
          <input class="login-field__input" type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••" required>
          <button class="login-field__toggle" id="loginPasswordToggle" type="button" aria-label="Show password">
            <span class="material-symbols-rounded" id="loginPasswordToggleIcon">visibility</span>
          </button>
        </div>
        <span class="login-field__error" id="loginPasswordError">Enter your password.</span>
      </div>

      <div class="login-row">
        <label class="login-remember">
          <input type="checkbox" id="loginRemember" checked>
          Remember Me
        </label>
        <button class="login-forgot" id="loginForgotBtn" type="button">Forgot Password?</button>
      </div>

      <button class="login-submit" id="loginSubmitBtn" type="submit">
        <span class="login-submit__spinner" aria-hidden="true"></span>
        <span class="login-submit__label">Login</span>
      </button>
    </form>

    <p class="login-card__footer">🔒 Only authorised clinic staff can access this dashboard.</p>
  </div>
</div>

<!-- ============ FORGOT PASSWORD MODAL ============ -->
<div class="modal-overlay" id="resetModalOverlay" hidden>
  <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
    <h3 class="modal__title" id="resetModalTitle">
      <span class="material-symbols-rounded" aria-hidden="true" style="vertical-align:-4px;">mail</span>
      Reset Password
    </h3>
    <p class="modal__date-label">Enter your account email and we'll send you a password reset link.</p>

    <div class="login-banner login-banner--error" id="resetError" role="alert"></div>
    <div class="login-banner login-banner--success" id="resetSuccess" role="status"></div>

    <div class="field">
      <label class="field__label" for="resetEmail">Email</label>
      <input class="field__input" type="email" id="resetEmail" placeholder="you@clinic.com">
    </div>

    <div class="btn-row btn-row--modal">
      <button class="btn btn--grey" id="resetCancelBtn" type="button">
        <span class="material-symbols-rounded">close</span> Cancel
      </button>
      <button class="btn btn--purple" id="resetSendBtn" type="button">
        <span class="material-symbols-rounded">send</span> Send Reset Link
      </button>
    </div>
  </div>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
